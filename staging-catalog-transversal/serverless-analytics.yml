service: ${self:custom.project}-service
frameworkVersion: "3"
useDotenv: true

provider: ${file(./serverless-files/provider.yml)}
    
custom: ${file(./serverless-files/custom.yml)}

package:
  individually: true
  exclude:
    - ./**

plugins:
  - serverless-python-requirements
  - serverless-plugin-common-excludes

resources:
  - ${file(./serverless-files/resources/roles.yml)}
  - ${file(./serverless-files/jobs/jobs.yml)}
  - ${file(./serverless-files/resources/outputs.yml)}