Resources:
  stagingCatalogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "iam-${self:custom.project}-${self:custom.stage}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Path: /
      Policies:
        - PolicyName: executionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - ${self:custom.transversalStepNotificationsArn}
        - PolicyName: "s3policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource:
                  - Fn::Sub: "arn:aws:s3:::${self:custom.bucketNameStaging}/*"
                  - Fn::Sub: "arn:aws:s3:::${self:custom.bucketNameStaging}/"
        - PolicyName: allow-kms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "kms:Encrypt"
                  - "kms:Decrypt"
                  - "kms:GenerateDataKey"
                Resource:
                  - ${self:custom.arnKms}
        - PolicyName: allow-event-bus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "events:PutEvents"
                Resource:
                  - ${self:custom.observabilityEventBusArn}
        - PolicyName: allow-secrets-manager
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource:
                  - "*"
    