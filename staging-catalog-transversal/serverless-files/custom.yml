# Tags
tagAplicativo:               ${env:tagAplicativo}
tagArea:                     ${env:tagArea}
tagCelula:                   ${env:tagCelula}
tagCompania:                 ${env:tagCompania}
tagDisponibilidad:           ${env:tagDisponibilidad}
tagProducto:                 ${env:tagProducto}
tagProyecto:                 ${env:tagProyecto}

# Project
stage:                      ${opt:stage}
region:                     ${env:region}
project:                    ${env:project}
deploymentBucketName:       ${env:deploymentBucketName}
schemasStackName:           ${env:schemasStackName}
projectStackName:           ${self:custom.project}-resources-${self:custom.stage}
notificationsStackName:     ${env:notificationsStackName}-${self:custom.stage}
analyticsObservabilityStack: ${env:analyticsObservabilityStack}

transversalStepNotificationsArn: ${cf:${self:custom.notificationsStackName}.NotificationsTransversalFunctionARN}
transversalStepNotificationsName: ${cf:${self:custom.notificationsStackName}.NotificationsTransversalFunctionName}

observabilityEventBusName:   ${cf:${self:custom.analyticsObservabilityStack}.JobObservabilityBusName}
observabilityEventBusArn:    ${cf:${self:custom.analyticsObservabilityStack}.JobObservabilityBusArn}


arnKmsStage:
    dev: ${env:arnKmsDEV}
    uat: ${env:arnKmsUAT}
    pdn: ${env:arnKmsPDN}
arnKms: ${self:custom.arnKmsStage.${self:custom.stage}}

# Buckets 
bucketNameSchema:      ${cf:${self:custom.schemasStackName}.ParametersTransversalBucketName}
bucketNameProject:     ${cf:${self:custom.projectStackName}.StagingCatalogTransversalBucketName}
projectBucketJobsPath: ${env:projectBucketJobsPath}

analyticsAccountIdStage:
  dev: ${env:analyticsAccountIdDEV}
  uat: ${env:analyticsAccountIdUAT}
  pdn: ${env:analyticsAccountIdPDN}
analyticsAccountId: ${self:custom.analyticsAccountIdStage.${self:custom.stage}}

bucketNameRaw: s3-${self:custom.analyticsAccountId}-datalake-${self:custom.stage}-raw
bucketNameStaging: s3-${self:custom.analyticsAccountId}-datalake-${self:custom.stage}-staging

# Job
jobNumberOfWorkersStage:
    dev: ${env:jobNumberOfWorkersDEV}
    uat: ${env:jobNumberOfWorkersUAT}
    pdn: ${env:jobNumberOfWorkersPDN}
jobNumberOfWorkers: ${self:custom.jobNumberOfWorkersStage.${self:custom.stage}}


glueVersion:          ${env:glueVersion}
jobMaxConcurrentRuns: ${env:jobMaxConcurrentRuns}
jobWorkerType:        ${env:jobWorkerType}
jobPythonVersion:     ${env:jobPythonVersion}
extraPythonFiles:     ${env:extraPythonFiles}

nameJobStagingCatalog: job-${self:custom.project}-v2