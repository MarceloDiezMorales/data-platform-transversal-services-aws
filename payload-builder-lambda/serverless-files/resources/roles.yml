Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Description: "Role for Lambda"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Path: /
      Policies:
      - PolicyName: "allow-kms"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - "kms:Encrypt"
                - "kms:Decrypt"
                - "kms:Get*"
                - "kms:GenerateDataKey"
              Resource:
                - ${self:custom.kmsARN}
      - PolicyName: "s3-policy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
                - "s3:ListBucket"
                - "s3:PutObjectAcl"
                - "s3:DeleteObject"
                - "s3:GetBucketAcl"
              Resource:
                - !Sub "arn:aws:s3:::${self:custom.dataLakeName}-raw"
                - !Sub "arn:aws:s3:::${self:custom.dataLakeName}-raw/*"
                - !Sub "arn:aws:s3:::${self:custom.dataLakeName}-raw/**"  
      RoleName: iam-${self:custom.project}-${self:custom.stage}-Role
      Tags: 
        - Key: Name
          Value: iam-${self:custom.project}-${self:custom.stage}-Role
